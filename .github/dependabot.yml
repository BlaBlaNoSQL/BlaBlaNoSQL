# Maintient à jour les actions épinglées par SHA dans les workflows.
# Ce fichier n'est lu par GitHub qu'une fois présent sur la branche par défaut.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
