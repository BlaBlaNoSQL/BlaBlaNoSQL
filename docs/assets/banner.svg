<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">BlaBlaNoSQL</title>
  <desc id="banner-desc">Covoiturage temps réel sur une architecture NoSQL distribuée : React, Express, Cassandra, JWT.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="banner-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#banner-bg)"/>

  <!-- Decorative cluster rings, partly off-canvas on the right -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3">
    <circle cx="1200" cy="200" r="150" stroke-opacity="0.07" stroke-dasharray="4 12"/>
    <circle cx="1200" cy="200" r="240" stroke-opacity="0.05" stroke-dasharray="4 14"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.12">
    <circle cx="1070" cy="125" r="6"/>
    <circle cx="1062" cy="268" r="6"/>
    <circle cx="1200" cy="50" r="6"/>
    <circle cx="1200" cy="350" r="6"/>
  </g>

  <!-- Logo (inlined: GitHub blocks external references inside SVG images) -->
  <g transform="translate(72 72)">
    <rect width="256" height="256" rx="56" fill="url(#banner-logo-bg)"/>
    <circle cx="128" cy="132" r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3" stroke-dasharray="4 10"/>
    <g fill="#FFFFFF" fill-opacity="0.28">
      <circle cx="128" cy="40" r="5"/>
      <circle cx="208" cy="86" r="5"/>
      <circle cx="208" cy="178" r="5"/>
      <circle cx="48" cy="86" r="5"/>
      <circle cx="48" cy="178" r="5"/>
    </g>
    <path d="M 60 190 C 100 190 92 124 128 130 C 164 136 170 108 196 100" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M 60 190 C 100 190 92 124 128 130 C 164 136 170 108 196 100" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>
    <path d="M 60 190 C 100 190 92 124 128 130 C 164 136 170 108 196 100" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="87.45 184.91"/>
    <circle cx="60" cy="190" r="15" fill="#F59E0B" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M196 102 C 186 88 172 78 172 62 A 24 24 0 1 1 220 62 C 220 78 206 88 196 102 Z" fill="#FB7185" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="196" cy="62" r="8" fill="#FFFFFF"/>
    <g transform="translate(117.69 130.42) rotate(-16.26)">
      <rect x="-15.5" y="-8" width="34" height="20" rx="6" fill="#0B0A26" fill-opacity="0.3"/>
      <rect x="-17" y="-10" width="34" height="20" rx="6" fill="#F59E0B" stroke="#1E1B4B" stroke-width="2"/>
      <rect x="-13" y="-6.5" width="4" height="13" rx="1.5" fill="#1E1B4B" fill-opacity="0.85"/>
      <rect x="-8" y="-7.5" width="10" height="15" rx="2.5" fill="#FCD34D"/>
      <rect x="3" y="-7.5" width="6.5" height="15" rx="2" fill="#1E1B4B"/>
      <circle cx="15" cy="-6" r="1.8" fill="#FEF3C7"/>
      <circle cx="15" cy="6" r="1.8" fill="#FEF3C7"/>
    </g>
  </g>

  <!-- Title and tagline -->
  <g font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="384" y="178" font-size="92" font-weight="800" letter-spacing="-2" fill="#FFFFFF">BlaBla<tspan fill="#F59E0B">NoSQL</tspan></text>
    <text x="388" y="232" font-size="30" font-weight="500" fill="#C7D2FE">Covoiturage temps réel, architecture NoSQL distribuée</text>

    <!-- Stack chips -->
    <g font-size="20" font-weight="600" text-anchor="middle">
      <rect x="388" y="272" width="96" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="436" y="299" fill="#E0E7FF">React</text>
      <rect x="496" y="272" width="116" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="554" y="299" fill="#E0E7FF">Express</text>
      <rect x="624" y="272" width="140" height="40" rx="20" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.6"/>
      <text x="694" y="299" fill="#FDE68A">Cassandra</text>
      <rect x="776" y="272" width="76" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="814" y="299" fill="#E0E7FF">JWT</text>
    </g>
  </g>
</svg>
